<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>İpek’in Haftalık Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --ink: #2D2A32;
    --muted: #7A7585;
    --line: #F0E6D8;
    --accent: #FF7A59;
    --green: #2BB673;
    --okul: #DCEBFF;   --okul-ink: #1F4E8C;
    --dans: #FFE0EC;   --dans-ink: #9C2B5E;
    --muzik: #EDE2FF;  --muzik-ink: #5A2E98;
    --odev: #FFF1CC;   --odev-ink: #8A5A00;
    --test: #FFE3D3;   --test-ink: #9A3B12;
    --okuma: #D8F5E8;  --okuma-ink: #166649;
    --oyun: #D9F7F4;   --oyun-ink: #0E6660;
    --uyku: #E6E4F0;   --uyku-ink: #46425E;
    --diger: #EFECE6;  --diger-ink: #4E4A42;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: 95px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 18px 40px; }

  header.ust {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, #FFE8D6 0%, #FFD6E8 100%);
    padding: 18px 22px; border-radius: 24px;
    box-shadow: 0 6px 20px rgba(255, 122, 89, 0.12);
  }
  .selam h1 { margin: 0; font-size: 24px; font-weight: 900; }
  .selam p { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 15px; }

  .ust-butonlar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .ses-btn {
    background: #fff; color: #5A2E98; border: 2px solid #EDE2FF;
    padding: 12px 14px; border-radius: 16px; font-family: inherit;
    font-weight: 900; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .ses-btn.kapali { opacity: 0.6; color: var(--muted); border-color: var(--line); }

  .ust-senkron-btn {
    background: #fff; color: var(--ink); border: 2px solid var(--line);
    padding: 12px 16px; border-radius: 16px; font-family: inherit;
    font-weight: 900; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .ust-senkron-btn.degisti {
    background: var(--green); color: #fff; border-color: var(--green);
    box-shadow: 0 4px 14px rgba(43, 182, 115, 0.4);
  }
  .ust-senkron-btn:disabled { opacity: 0.6; cursor: wait; }

  .bildirim-serit {
    margin-top: 12px; padding: 12px 16px; border-radius: 14px;
    font-weight: 800; font-size: 15px; text-align: center; display: none;
  }
  .bildirim-serit.ok { display: block; background: #D8F5E8; color: #166649; border: 2px solid #2BB673; }
  .bildirim-serit.err { display: block; background: #FFE0E0; color: #8A1F1F; border: 2px solid #E05A5A; }

  .kaydet-cubuk {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 720px; z-index: 999;
    background: #1F4E8C; color: #fff; padding: 14px 18px;
    border-radius: 20px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; box-shadow: 0 10px 28px rgba(0,0,0,0.3);
  }
  .kaydet-cubuk span { font-weight: 800; font-size: 15px; }
  .kaydet-cubuk button {
    background: var(--green); color: #fff; border: none;
    padding: 12px 22px; border-radius: 14px; font-family: inherit;
    font-weight: 900; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  .kaydet-cubuk button:disabled { opacity: 0.6; }

  .sekmeler {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 16px;
  }
  .sekme {
    min-height: 54px; border: 2px solid var(--line); background: var(--card);
    border-radius: 18px; font-family: inherit; font-size: 17px; font-weight: 800;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .sekme.aktif {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 6px 14px rgba(255, 122, 89, 0.28);
  }

  .gun-serit {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px; margin-top: 14px;
  }
  .gun-dugme {
    background: var(--card); border: 2px solid var(--line);
    border-radius: 14px; padding: 8px 4px; text-align: center;
    cursor: pointer; font-family: inherit; font-weight: 800; color: var(--ink);
  }
  .gun-dugme .g-ad { font-size: 12px; color: var(--muted); display: block; }
  .gun-dugme .g-no { font-size: 16px; display: block; margin-top: 2px; }
  .gun-dugme.secili { border-color: var(--accent); background: #FFF0E8; }

  .bilgi-serit {
    margin-top: 14px; background: #FFF3D6; border: 2px dashed #F2C46D;
    padding: 12px 16px; border-radius: 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-weight: 800; color: #6E4B00; font-size: 15px;
  }
  .bilgi-etiket {
    background: #fff; padding: 5px 12px; border-radius: 999px; font-size: 14px;
  }

  .uyari-serit {
    margin-top: 12px; background: #FFE8E0; color: #8A2E12;
    padding: 10px 14px; border-radius: 14px; font-weight: 800; font-size: 14px;
  }

  .kilit-not {
    margin-top: 14px; background: #F3EEF8; color: #5B4B73;
    padding: 11px 16px; border-radius: 14px;
    font-weight: 700; font-size: 14px; text-align: center;
  }

  .liste { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .kart {
    background: var(--card); border-radius: 20px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 12px rgba(45, 42, 50, 0.05);
    border: 2px solid transparent;
  }
  .kart.simdi { border-color: var(--accent); box-shadow: 0 6px 18px rgba(255, 122, 89, 0.2); }
  .kart.tamam { opacity: 0.65; }
  .kart.tamam .baslik { text-decoration: line-through; }

  .ikon {
    width: 54px; height: 54px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0; cursor: pointer;
  }
  .govde { flex: 1; min-width: 0; }
  .saat { font-size: 14px; font-weight: 800; color: var(--muted); }
  .baslik { font-size: 18px; font-weight: 900; margin-top: 2px; }
  .etiket {
    display: inline-block; font-size: 12px; font-weight: 800;
    padding: 3px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
  }

  .tur-okul  .ikon, .tur-okul  .etiket { background: var(--okul);  color: var(--okul-ink); }
  .tur-dans  .ikon, .tur-dans  .etiket { background: var(--dans);  color: var(--dans-ink); }
  .tur-muzik .ikon, .tur-muzik .etiket { background: var(--muzik); color: var(--muzik-ink); }
  .tur-odev  .ikon, .tur-odev  .etiket { background: var(--odev);  color: var(--odev-ink); }
  .tur-test  .ikon, .tur-test  .etiket { background: var(--test);  color: var(--test-ink); }
  .tur-okuma .ikon, .tur-okuma .etiket { background: var(--okuma); color: var(--okuma-ink); }
  .tur-oyun  .ikon, .tur-oyun  .etiket { background: var(--oyun);  color: var(--oyun-ink); }
  .tur-uyku  .ikon, .tur-uyku  .etiket { background: var(--uyku);  color: var(--uyku-ink); }
  .tur-diger .ikon, .tur-diger .etiket { background: var(--diger); color: var(--diger-ink); }

  .sira-kutu {
    display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
  }
  .sira-btn {
    width: 44px; height: 32px; border-radius: 10px;
    border: 2px solid #E2D5C5; background: #FFF8F0;
    color: var(--ink); font-size: 15px; font-weight: 900;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .sira-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sira-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  .isaret {
    width: 56px; height: 56px; border-radius: 16px;
    border: 3px solid #D8D0C5; background: #FAF6F0;
    font-size: 26px; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #fff;
  }
  .isaret.aktif { background: var(--green); border-color: var(--green); }
  .isaret:disabled { cursor: not-allowed; opacity: 0.45; }

  .hafta-izgara {
    margin-top: 16px;
    display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr));
    gap: 8px; overflow-x: auto; padding-bottom: 8px;
  }
  .gun-sutun {
    background: var(--card); border-radius: 18px; padding: 10px;
    border: 2px solid var(--line); min-width: 120px; cursor: pointer;
  }
  .gun-sutun.bugun { border-color: var(--accent); }
  .gun-baslik {
    text-align: center; padding-bottom: 8px; margin-bottom: 8px;
    border-bottom: 2px dashed var(--line);
  }
  .gun-baslik .ad { font-weight: 900; font-size: 14px; }
  .gun-baslik .trh { font-size: 12px; color: var(--muted); font-weight: 700; }
  .mini {
    padding: 6px 8px; border-radius: 10px; margin-bottom: 6px;
    font-size: 12px; font-weight: 800;
  }
  .mini .m-saat { display: block; font-size: 11px; opacity: 0.8; }

  .panel {
    margin-top: 16px; background: var(--card); border-radius: 22px;
    padding: 20px; border: 2px solid var(--line);
  }
  .panel h3 { margin: 0 0 12px; font-size: 19px; font-weight: 900; }
  .alan { margin-bottom: 12px; }
  .alan label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 5px; }
  .alan input {
    width: 100%; min-height: 48px; padding: 10px 14px;
    border-radius: 14px; border: 2px solid var(--line);
    font-family: inherit; font-size: 16px; font-weight: 700;
  }
  .ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hazir-chipler { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    min-height: 44px; padding: 8px 14px; border-radius: 999px;
    border: 2px solid var(--line); background: #FFF8F0;
    font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .ana-dugme {
    width: 100%; min-height: 54px; border: none; border-radius: 16px;
    background: var(--accent); color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 900; cursor: pointer;
  }
  .ana-dugme:disabled { opacity: 0.5; }
  .ikincil-dugme {
    width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: 16px;
    background: #FFF3D6; color: #6E4B00;
    font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer;
  }
  .mesaj {
    margin-top: 10px; padding: 10px 14px; border-radius: 12px;
    font-weight: 800; font-size: 14px; display: none;
  }
  .mesaj.ok { display: block; background: #D8F5E8; color: #166649; }
  .mesaj.err { display: block; background: #FFE0E0; color: #8A1F1F; }

  .gizli { display: none !important; }
  .yukleniyor { text-align: center; padding: 40px; font-weight: 800; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="ust">
    <div class="selam">
      <h1>Merhaba İpek! 🌸</h1>
      <p id="seciliTarihMetin">Yükleniyor…</p>
    </div>
    <div class="ust-butonlar">
      <button type="button" class="ses-btn" id="sesOkuBtn" onclick="siradakiGoreviSeslendir(true)" title="Sıradaki görevi sesli oku">
        🔊 Sesli Oku
      </button>
      <button type="button" class="ust-senkron-btn" id="ustGuncelleBtn" onclick="degisiklikleriKaydet()">
        🔄 Planı ve Takvimi Güncelle
      </button>
    </div>
  </header>

  <div class="bildirim-serit" id="ustBildirim"></div>

  <nav class="sekmeler" role="tablist">
    <button class="sekme aktif" id="sekmeBugunBtn" onclick="sekmeAc('bugun')">☀️ Günlük Plan</button>
    <button class="sekme" id="sekmeHaftaBtn" onclick="sekmeAc('hafta')">🗓️ 7 Gün</button>
    <button class="sekme" id="sekmeEkleBtn" onclick="sekmeAc('ekle')">➕ Ekle</button>
  </nav>

  <!-- GÜNLÜK GÖRÜNÜM -->
  <section id="gorunumBugun">
    <div class="gun-serit" id="gunSerit"></div>
    <div id="bilgiAlani"></div>
    <div id="uyariAlani"></div>
    <div class="kilit-not" id="kilitNot"></div>
    <div class="liste" id="gorevListesi">
      <div class="yukleniyor">Programın hazırlanıyor… ✨</div>
    </div>
  </section>

  <!-- HAFTALIK GÖRÜNÜM -->
  <section id="gorunumHafta" class="gizli">
    <div class="hafta-izgara" id="haftaIzgara"></div>
  </section>

  <!-- EKLEME GÖRÜNÜMÜ -->
  <section id="gorunumEkle" class="gizli">
    <div class="panel">
      <h3>🎮 Oyun ya da Aktivite Ekle</h3>
      <div class="hazir-chipler">
        <button type="button" class="chip" onclick="hazirSec('Bahçede oyun')">🌳 Bahçede oyun</button>
        <button type="button" class="chip" onclick="hazirSec('Resim yapma')">🎨 Resim yapma</button>
        <button type="button" class="chip" onclick="hazirSec('Arkadaşla oyun')">🤸 Arkadaşla oyun</button>
        <button type="button" class="chip" onclick="hazirSec('Kutu oyunu')">🎲 Kutu oyunu</button>
      </div>
      <div class="alan">
        <label for="oyunBaslik">Ne yapacaksın?</label>
        <input id="oyunBaslik" type="text" placeholder="Örn: Lego yapma">
      </div>
      <div class="alan">
        <label for="oyunTarih">Hangi gün?</label>
        <input id="oyunTarih" type="date">
      </div>
      <div class="ikili">
        <div class="alan">
          <label for="oyunBas">Başlangıç saati</label>
          <input id="oyunBas" type="time" value="19:30">
        </div>
        <div class="alan">
          <label for="oyunBit">Bitiş saati</label>
          <input id="oyunBit" type="time" value="20:15">
        </div>
      </div>
      <button class="ana-dugme" id="oyunKaydetBtn" onclick="oyunKaydet()">Programa Ekle</button>
      <div class="mesaj" id="oyunMesaj"></div>
    </div>

    <div class="panel">
      <h3>🏖️ Tatil / Okul Yok Günü Bildir</h3>
      <div class="alan">
        <label for="tatilTarih">Hangi gün okul yok?</label>
        <input id="tatilTarih" type="date">
      </div>
      <div class="alan">
        <label for="tatilAciklama">Neden? (isteğe bağlı)</label>
        <input id="tatilAciklama" type="text" placeholder="Örn: Kar tatili / Resmi tatil">
      </div>
      <button class="ikincil-dugme" id="tatilKaydetBtn" onclick="tatilKaydet()">Okul Yok Olarak İşaretle</button>
      <div class="mesaj" id="tatilMesaj"></div>
    </div>
  </section>
</div>

<!-- DEĞİŞİKLİK YAPILDIĞINDA ÇIKAN SABİT KAYDET ÇUBUĞU -->
<div class="kaydet-cubuk gizli" id="altKaydetCubuk">
  <span id="degisiklikMetin">Saatler yeniden hesaplandı!</span>
  <button type="button" id="altKaydetBtn" onclick="degisiklikleriKaydet()">✅ Kaydet ve Takvimi Güncelle</button>
</div>

<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYIdXXb_XjCconapEvrnSib1YVbHVzv1ctgOFanFmuQ_rzWKQjI_52ZD8KwgOjQ-0/exec";

  var SABIT_ANAHTAR = "<?= typeof ANAHTAR !== 'undefined' ? ANAHTAR : '' ?>";
  if (SABIT_ANAHTAR.indexOf('<?') === 0) SABIT_ANAHTAR = '';
  var URL_PARAMS = new URLSearchParams(window.location.search);
  var ANAHTAR = URL_PARAMS.get('k') || SABIT_ANAHTAR || '';

  var DURUM = {
    bugun: null,
    simdiSaat: '00:00',
    isaretlemeSaati: '18:00',
    seciliGun: null,
    gunler: [],
    kaydediliyor: false,
    degisiklikVar: false,
    bekleyenIsaretler: {},
    bekleyenSiralamalar: {},
    okunanGorevAnahtarlari: {}
  };

  var TUR_BILGI = {
    okul:  { ikon: '🎒', etiket: 'Okul' },
    dans:  { ikon: '🩰', etiket: 'Dans' },
    muzik: { ikon: '🎹', etiket: 'Müzik' },
    odev:  { ikon: '✏️', etiket: 'Ödev' },
    test:  { ikon: '🧠', etiket: 'Test' },
    okuma: { ikon: '📖', etiket: 'Okuma' },
    oyun:  { ikon: '🎨', etiket: 'Oyun' },
    uyku:  { ikon: '🌙', etiket: 'Uyku' },
    diger: { ikon: '📌', etiket: 'Etkinlik' }
  };

  var GUN_KISA = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  var GUN_UZUN = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  var AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

  /* --- TÜRKÇE SESLİ ASİSTAN (WEB SPEECH API + DİNG-DONG) --- */
  function dingDongCal(bitinceCallback) {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) { if (bitinceCallback) bitinceCallback(); return; }
      var ctx = new AudioCtx();
      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(659.25, ctx.currentTime); // E5
      osc1.frequency.setValueAtTime(523.25, ctx.currentTime + 0.25); // C5
      gain1.gain.setValueAtTime(0.2, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start();
      osc1.stop(ctx.currentTime + 0.7);
      setTimeout(function () {
        if (bitinceCallback) bitinceCallback();
      }, 650);
    } catch (e) {
      if (bitinceCallback) bitinceCallback();
    }
  }

  function metniSeslendir(metin, zilCalsinMi) {
    if (!('speechSynthesis' in window)) return;
    var temizMetin = String(metin || '')
      .replace(/[🌸🎒🩰🎹✏️🧠📖🎨🌙📌✅🔄⏳💡⚠️ℹ️]/g, '')
      .replace(/—/g, ', ')
      .trim();

    var konus = function () {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(temizMetin);
        u.lang = 'tr-TR';
        u.rate = 0.98;
        u.pitch = 1.05;
        var sesler = window.speechSynthesis.getVoices() || [];
        var trSes = sesler.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf('tr') === 0; });
        if (trSes) u.voice = trSes;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    };

    if (zilCalsinMi) dingDongCal(konus);
    else konus();
  }

  function siradakiGoreviSeslendir(manuelTiklandi) {
    var secili = DURUM.gunler.find(function (g) { return g.dateKey === (DURUM.seciliGun || DURUM.bugun); });
    if (!secili || !secili.bloklar) return;

    var simdi = saatCevir(cihazSimdiDakika());
    var aktif = secili.bloklar.find(function (b) {
      return !b.yapildi && b.start !== '✓' && simdi >= b.start && simdi < b.end;
    });
    var siradaki = secili.bloklar.find(function (b) {
      return !b.yapildi && b.start !== '✓' && b.start > simdi;
    });

    if (aktif) {
      metniSeslendir('İpekciğim, şu anda saat ' + aktif.start + ' ile ' + aktif.end + ' arasında ' + aktif.title + ' görevin var.', true);
    } else if (siradaki) {
      metniSeslendir('İpekciğim, sıradaki görevin saat ' + siradaki.start + '’da başlıyor: ' + siradaki.title, true);
    } else if (manuelTiklandi) {
      metniSeslendir('Harikasın İpek! Bugünkü tüm görevlerini tamamladın, iyi dinlenmeler!', true);
    }
  }

  function otomatikSaatAnonsKontrol() {
    if (!DURUM.bugun || !DURUM.gunler.length) return;
    var bugunGun = DURUM.gunler.find(function (g) { return g.dateKey === DURUM.bugun; });
    if (!bugunGun || !bugunGun.bloklar) return;

    var simdi = saatCevir(cihazSimdiDakika());
    DURUM.simdiSaat = simdi;

    bugunGun.bloklar.forEach(function (b) {
      if (b.yapildi || b.start === '✓') return;
      var anahtar = DURUM.bugun + '|' + b.start + '|' + b.title;
      // Tam görevin başlangıç dakikası geldiğinde 1 kez sesli anons yap
      if (b.start === simdi && !DURUM.okunanGorevAnahtarlari[anahtar]) {
        DURUM.okunanGorevAnahtarlari[anahtar] = true;
        ustBildirimGoster('🔊 Şimdi Başlıyor (' + b.start + '): ' + b.title, true);
        metniSeslendir('İpekciğim, saat ' + b.start + ' oldu. Şimdi sırada ' + b.title + ' var. Kolay gelsin!', true);
        ciz();
      }
    });
  }

  function dkCevir(s) {
    var p = String(s || '00:00').split(':').map(Number);
    return (p[0] || 0) * 60 + (p[1] || 0);
  }

  function saatCevir(dk) {
    var h = Math.floor(dk / 60);
    var m = dk % 60;
    return (h < 10 ? '0' + h : '' + h) + ':' + (m < 10 ? '0' + m : '' + m);
  }

  function cihazSimdiDakika() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }

  function ustBildirimGoster(metin, basarili) {
    var el = document.getElementById('ustBildirim');
    el.textContent = metin;
    el.className = 'bildirim-serit ' + (basarili ? 'ok' : 'err');
    setTimeout(function () {
      el.className = 'bildirim-serit';
    }, 6000);
  }

  function tarihParcala(dateKey) {
    var p = dateKey.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function uzunTarihFormatla(dateKey) {
    var d = tarihParcala(dateKey);
    return d.getDate() + ' ' + AYLAR[d.getMonth()] + ' ' + GUN_UZUN[d.getDay()];
  }

  function sekmeAc(ad) {
    ['bugun', 'hafta', 'ekle'].forEach(function (s) {
      var gorunum = document.getElementById('gorunum' + s.charAt(0).toUpperCase() + s.slice(1));
      var btn = document.getElementById('sekme' + s.charAt(0).toUpperCase() + s.slice(1) + 'Btn');
      if (s === ad) { gorunum.classList.remove('gizli'); btn.classList.add('aktif'); }
      else { gorunum.classList.add('gizli'); btn.classList.remove('aktif'); }
    });
  }

  function isaretlemeAcikMi(dateKey) {
    if (!DURUM.bugun) return false;
    if (dateKey < DURUM.bugun) return true;
    if (dateKey > DURUM.bugun) return false;
    return DURUM.simdiSaat >= DURUM.isaretlemeSaati;
  }

  function blokSiralanabilirMi(b) {
    if (!b || b.yapildi || b.start === '✓') return false;
    if (b.tur === 'uyku' || b.tur === 'okul') return false;
    if (b.siralanabilir === true) return true;
    return Boolean(b.otomatik);
  }

  function yerelSaatleriHesapla(gun) {
    if (!gun || !gun.bloklar) return;
    var varsayilanBas = dkCevir(gun.tatil ? '10:00' : '17:00');
    var pencereBas = varsayilanBas;

    if (gun.dateKey === DURUM.bugun) {
      var simdiDk = cihazSimdiDakika();
      DURUM.simdiSaat = saatCevir(simdiDk);
      if (simdiDk > pencereBas && simdiDk < dkCevir('21:30')) {
        pencereBas = simdiDk;
      }
    }
    var pencereBit = dkCevir('21:30');

    var tamamlananlar = [];
    var sabitler = [];
    var siralanabilirler = [];
    var uykuBloklari = [];

    gun.bloklar.forEach(function (b) {
      var sDk = b.sureDk || (b.start !== '✓' ? (dkCevir(b.end) - dkCevir(b.start)) : 30);
      if (!sDk || sDk <= 0) sDk = 30;
      b.sureDk = sDk;

      if (b.tur === 'uyku') {
        uykuBloklari.push(b);
      } else if (b.yapildi) {
        tamamlananlar.push(b);
      } else if (!b.otomatik || b.tur === 'okul') {
        b._basDk = dkCevir(b.start);
        b._bitDk = dkCevir(b.end);
        sabitler.push(b);
      } else {
        siralanabilirler.push(b);
      }
    });

    var dolu = sabitler.map(function (s) { return { basDk: s._basDk, bitDk: s._bitDk }; });
    var yerlesenler = [];

    siralanabilirler.forEach(function (g) {
      dolu.sort(function (a, b) { return a.basDk - b.basDk; });
      var imlec = pencereBas;
      var bosluklar = [];
      for (var i = 0; i < dolu.length; i++) {
        var eng = dolu[i];
        if (eng.bitDk <= pencereBas || eng.basDk >= pencereBit) continue;
        var eBas = Math.max(pencereBas, eng.basDk);
        var eBit = Math.min(pencereBit, eng.bitDk);
        if (eBas > imlec) bosluklar.push({ basDk: imlec, bitDk: eBas });
        if (eBit > imlec) imlec = eBit;
      }
      if (imlec < pencereBit) bosluklar.push({ basDk: imlec, bitDk: pencereBit });

      for (var k = 0; k < bosluklar.length; k++) {
        if (bosluklar[k].bitDk - bosluklar[k].basDk >= g.sureDk) {
          var gBas = bosluklar[k].basDk;
          var gBit = gBas + g.sureDk;
          g.start = saatCevir(gBas);
          g.end = saatCevir(gBit);
          g._basDk = gBas;
          dolu.push({ basDk: gBas, bitDk: gBit + 5 });
          yerlesenler.push(g);
          break;
        }
      }
    });

    var saatliler = sabitler.concat(yerlesenler);
    saatliler.sort(function (a, b) { return a._basDk - b._basDk; });
    gun.bloklar = tamamlananlar.concat(saatliler).concat(uykuBloklari);
  }

  function gunSec(dateKey) {
    DURUM.seciliGun = dateKey;
    document.getElementById('oyunTarih').value = dateKey;
    document.getElementById('tatilTarih').value = dateKey;
    ciz();
  }

  function veriUygula(veri, hedefGun) {
    if (!veri || !veri.gunler) return;
    DURUM.bugun = veri.bugun;
    DURUM.simdiSaat = veri.simdiSaat;
    DURUM.isaretlemeSaati = veri.isaretlemeSaati || '18:00';
    DURUM.gunler = veri.gunler || [];
    DURUM.seciliGun = hedefGun || DURUM.seciliGun || veri.bugun;
    DURUM.degisiklikVar = false;
    DURUM.bekleyenIsaretler = {};
    DURUM.bekleyenSiralamalar = {};
    document.getElementById('oyunTarih').value = DURUM.seciliGun;
    document.getElementById('tatilTarih').value = DURUM.seciliGun;
    ciz();
  }

  function kaydetButonlariniGuncelle() {
    var ustBtn = document.getElementById('ustGuncelleBtn');
    var altCubuk = document.getElementById('altKaydetCubuk');
    var altBtn = document.getElementById('altKaydetBtn');

    if (DURUM.kaydediliyor) {
      ustBtn.disabled = true;
      ustBtn.textContent = '⏳ Takvim Güncelleniyor…';
      altBtn.disabled = true;
      altBtn.textContent = '⏳ Kaydediliyor…';
      return;
    }

    ustBtn.disabled = false;
    altBtn.disabled = false;
    altBtn.textContent = '✅ Kaydet ve Takvimi Güncelle';

    if (DURUM.degisiklikVar) {
      ustBtn.classList.add('degisti');
      ustBtn.textContent = '✅ Değişiklikleri Kaydet ve Güncelle';
      altCubuk.classList.remove('gizli');
    } else {
      ustBtn.classList.remove('degisti');
      ustBtn.textContent = '🔄 Planı ve Takvimi Güncelle';
      altCubuk.classList.add('gizli');
    }
  }

  function ciz() {
    kaydetButonlariniGuncelle();
    if (!DURUM.gunler.length) return;
    var secili = DURUM.gunler.find(function (g) { return g.dateKey === DURUM.seciliGun; }) || DURUM.gunler[0];
    DURUM.seciliGun = secili.dateKey;

    var bugunEk = secili.dateKey === DURUM.bugun ? ' • Bugün' : '';
    document.getElementById('seciliTarihMetin').textContent = uzunTarihFormatla(secili.dateKey) + bugunEk;

    var seritHtml = DURUM.gunler.map(function (g) {
      var d = tarihParcala(g.dateKey);
      var sec = g.dateKey === secili.dateKey ? ' secili' : '';
      return '<button class="gun-dugme' + sec + '" onclick="gunSec(\'' + g.dateKey + '\')">' +
        '<span class="g-ad">' + GUN_KISA[d.getDay()] + '</span>' +
        '<span class="g-no">' + d.getDate() + '</span></button>';
    }).join('');
    document.getElementById('gunSerit').innerHTML = seritHtml;

    var bilgiAlani = document.getElementById('bilgiAlani');
    if (secili.bilgi && secili.bilgi.length) {
      bilgiAlani.innerHTML = '<div class="bilgi-serit">ℹ️ <span>Aile bilgisi:</span>' +
        secili.bilgi.map(function (b) {
          var saat = b.allDay ? 'Tüm gün' : (b.start + '–' + b.end);
          return '<span class="bilgi-etiket">' + escapeHtml(b.title) + ' (' + saat + ')</span>';
        }).join('') + '</div>';
    } else {
      bilgiAlani.innerHTML = '';
    }

    var uyariAlani = document.getElementById('uyariAlani');
    if (secili.uyarilar && secili.uyarilar.length) {
      uyariAlani.innerHTML = secili.uyarilar.map(function (u) {
        return '<div class="uyari-serit">⚠️ ' + escapeHtml(u) + '</div>';
      }).join('');
    } else {
      uyariAlani.innerHTML = '';
    }

    var acik = isaretlemeAcikMi(secili.dateKey);
    var kilitNot = document.getElementById('kilitNot');
    if (DURUM.degisiklikVar) {
      kilitNot.textContent = '💡 Saatler kaydırıldı! Google Takvim’e işlemek için "Kaydet ve Takvimi Güncelle" tuşuna bas.';
    } else {
      kilitNot.textContent = '🔊 Kartın solundaki ikona dokunarak görevi sesli dinleyebilir, ▲▼ ile sırasını değiştirebilirsin.';
    }

    var siralanabilirler = secili.bloklar.filter(blokSiralanabilirMi);

    var listeHtml = secili.bloklar.map(function (b) {
      var tb = TUR_BILGI[b.tur] || TUR_BILGI.diger;
      var simdiMi = (secili.dateKey === DURUM.bugun) && !b.yapildi && (DURUM.simdiSaat >= b.start && DURUM.simdiSaat < b.end);
      var kartSinif = 'kart tur-' + b.tur + (simdiMi ? ' simdi' : '') + (b.yapildi ? ' tamam' : '');
      var otomatikEtiket = b.otomatik ? '<span class="etiket">Akıllı plan</span>' : '<span class="etiket">' + tb.etiket + '</span>';
      var dugmeSinif = 'isaret' + (b.yapildi ? ' aktif' : '');
      var kilitli = (!acik || b.tur === 'uyku' || DURUM.kaydediliyor) ? ' disabled' : '';
      var idKod = encodeURIComponent(b.id);
      var baslikKod = encodeURIComponent(b.title);
      var saatMetni = (b.yapildi || b.start === '✓') ? '✓ Tamamlandı' : (b.start + ' – ' + b.end);

      var siraButonlariHtml = '';
      if (blokSiralanabilirMi(b)) {
        var sIdx = siralanabilirler.indexOf(b);
        var ilkMi = (sIdx <= 0) || DURUM.kaydediliyor;
        var sonMu = (sIdx === -1 || sIdx >= siralanabilirler.length - 1) || DURUM.kaydediliyor;
        siraButonlariHtml = '<div class="sira-kutu">' +
          '<button type="button" class="sira-btn" title="Üste taşı" ' + (ilkMi ? 'disabled' : '') +
            ' onclick="gorevTasi(\'' + baslikKod + '\', \'' + secili.dateKey + '\', \'yukari\')">▲</button>' +
          '<button type="button" class="sira-btn" title="Alta taşı" ' + (sonMu ? 'disabled' : '') +
            ' onclick="gorevTasi(\'' + baslikKod + '\', \'' + secili.dateKey + '\', \'asagi\')">▼</button>' +
        '</div>';
      }

      return '<div class="' + kartSinif + '">' +
        '<div class="ikon" title="Sesli dinlemek için dokun" onclick="kartSeslendir(\'' + baslikKod + '\', \'' + b.start + '\', \'' + b.end + '\')">' + tb.ikon + '</div>' +
        '<div class="govde">' +
          '<div class="saat">' + saatMetni + otomatikEtiket + '</div>' +
          '<div class="baslik">' + escapeHtml(b.title) + '</div>' +
        '</div>' +
        siraButonlariHtml +
        (b.tur === 'uyku' ? '' :
          '<button type="button" class="' + dugmeSinif + '"' + kilitli +
            ' aria-label="Görev işaretle" onclick="gorevTikla(\'' + idKod + '\', \'' + secili.dateKey + '\')">' +
            (b.yapildi ? '✓' : '') + '</button>') +
      '</div>';
    }).join('');
    document.getElementById('gorevListesi').innerHTML = listeHtml;

    var haftaHtml = DURUM.gunler.map(function (g) {
      var d = tarihParcala(g.dateKey);
      var bugunSinif = g.dateKey === DURUM.bugun ? ' bugun' : '';
      var miniHtml = g.bloklar.map(function (b) {
        var mSaat = (b.yapildi || b.start === '✓') ? '✓ Bitti' : (b.start + '–' + b.end);
        return '<div class="mini tur-' + b.tur + '" style="background:var(--' + b.tur + ');color:var(--' + b.tur + '-ink)">' +
          '<span class="m-saat">' + mSaat + '</span>' +
          escapeHtml(b.title) + '</div>';
      }).join('');
      return '<div class="gun-sutun' + bugunSinif + '" onclick="haftadanGuneGit(\'' + g.dateKey + '\')">' +
        '<div class="gun-baslik"><div class="ad">' + GUN_UZUN[d.getDay()] + '</div>' +
        '<div class="trh">' + d.getDate() + ' ' + AYLAR[d.getMonth()] + '</div></div>' +
        miniHtml + '</div>';
    }).join('');
    document.getElementById('haftaIzgara').innerHTML = haftaHtml;
  }

  function kartSeslendir(baslikKod, bas, bit) {
    var baslik = decodeURIComponent(baslikKod);
    if (bas === '✓') {
      metniSeslendir(baslik + ', tamamlandı.', false);
    } else {
      metniSeslendir('Saat ' + bas + ' ile ' + bit + ' arası: ' + baslik, false);
    }
  }

  function haftadanGuneGit(dateKey) {
    gunSec(dateKey);
    sekmeAc('bugun');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sunucuCagir(metot, argumanlar, basari, hata) {
    var hataYakalayici = hata || function (err) {
      ustBildirimGoster('Hata: ' + (err && err.message ? err.message : err), false);
    };

    if (window.google && google.script && google.script.run) {
      var cagri = google.script.run.withSuccessHandler(basari).withFailureHandler(hataYakalayici);
      cagri[metot].apply(cagri, argumanlar);
      return;
    }

    if (!ANAHTAR) {
      hataYakalayici(new Error('Bağlantı anahtarı (?k=...) eksik!'));
      return;
    }

    var url = new URL(APPS_SCRIPT_URL);
    url.searchParams.set('k', argumanlar[0] || ANAHTAR);
    url.searchParams.set('_t', Date.now());

    if (metot === 'haftaGetir') {
      url.searchParams.set('api', 'hafta');
      if (argumanlar[1]) url.searchParams.set('baslangic', argumanlar[1]);
    } else if (metot === 'topluGuncelle') {
      url.searchParams.set('api', 'kaydet');
      url.searchParams.set('veri', JSON.stringify({
        tarih: argumanlar[1],
        siralama: argumanlar[2],
        isaretler: argumanlar[3]
      }));
    } else if (metot === 'oyunEkle') {
      url.searchParams.set('api', 'oyunEkle');
      url.searchParams.set('veri', JSON.stringify({
        tarih: argumanlar[1],
        baslik: argumanlar[2],
        baslangic: argumanlar[3],
        bitis: argumanlar[4]
      }));
    } else if (metot === 'okulYokEkle') {
      url.searchParams.set('api', 'okulYokEkle');
      url.searchParams.set('veri', JSON.stringify({
        tarih: argumanlar[1],
        aciklama: argumanlar[2]
      }));
    }

    fetch(url.toString(), {
      method: 'GET',
      credentials: 'omit',
      redirect: 'follow'
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.hata || 'Sunucu hatası');
      basari(res.veri);
    })
    .catch(hataYakalayici);
  }

  function gorevTasi(baslikKod, dateKey, yon) {
    var baslik = decodeURIComponent(baslikKod);
    var gun = DURUM.gunler.find(function (g) { return g.dateKey === dateKey; });
    if (!gun || !gun.bloklar) return;

    var siralanabilirIndexler = [];
    gun.bloklar.forEach(function (b, idx) {
      if (blokSiralanabilirMi(b)) siralanabilirIndexler.push(idx);
    });

    var mevcutPos = siralanabilirIndexler.findIndex(function (blokIdx) {
      return gun.bloklar[blokIdx].title === baslik;
    });
    var hedefPos = (yon === 'yukari') ? mevcutPos - 1 : mevcutPos + 1;
    if (mevcutPos === -1 || hedefPos < 0 || hedefPos >= siralanabilirIndexler.length) return;

    var idx1 = siralanabilirIndexler[mevcutPos];
    var idx2 = siralanabilirIndexler[hedefPos];
    var gecici = gun.bloklar[idx1];
    gun.bloklar[idx1] = gun.bloklar[idx2];
    gun.bloklar[idx2] = gecici;

    yerelSaatleriHesapla(gun);

    DURUM.bekleyenSiralamalar[dateKey] = gun.bloklar
      .filter(blokSiralanabilirMi)
      .map(function (b) { return b.title; });

    DURUM.degisiklikVar = true;
    ciz();
  }

  function gorevTikla(idKod, dateKey) {
    var id = decodeURIComponent(idKod);
    var gun = DURUM.gunler.find(function (g) { return g.dateKey === dateKey; });
    if (!gun) return;
    var blok = gun.bloklar.find(function (b) { return b.id === id; });
    if (!blok) return;

    blok.yapildi = !blok.yapildi;
    yerelSaatleriHesapla(gun);

    if (blok.yapildi) {
      var siradaki = gun.bloklar.find(blokSiralanabilirMi);
      if (siradaki) {
        metniSeslendir('Harikasın İpek! Şimdi sıradaki görevin: ' + siradaki.title, true);
      } else {
        metniSeslendir('Harikasın İpek! Bugünkü görevlerini bitirdin!', true);
      }
    }

    DURUM.bekleyenIsaretler[id] = blok.yapildi;
    DURUM.bekleyenSiralamalar[dateKey] = gun.bloklar
      .filter(blokSiralanabilirMi)
      .map(function (b) { return b.title; });
    DURUM.degisiklikVar = true;
    ciz();
  }

  function degisiklikleriKaydet() {
    var aktifGun = DURUM.seciliGun || DURUM.bugun;
    var gunObj = DURUM.gunler.find(function (g) { return g.dateKey === aktifGun; });
    if (gunObj && !DURUM.bekleyenSiralamalar[aktifGun]) {
      DURUM.bekleyenSiralamalar[aktifGun] = gunObj.bloklar
        .filter(blokSiralanabilirMi)
        .map(function (b) { return b.title; });
    }

    DURUM.kaydediliyor = true;
    ciz();

    sunucuCagir('topluGuncelle', [ANAHTAR, aktifGun, DURUM.bekleyenSiralamalar, DURUM.bekleyenIsaretler], function (yeniVeri) {
      DURUM.kaydediliyor = false;
      if (yeniVeri && yeniVeri.gunler) {
        veriUygula(yeniVeri, aktifGun);
        ustBildirimGoster('✅ Plan kaydedildi ve Google Takvim saatleri güncellendi!', true);
      } else {
        verileriYukle(aktifGun);
      }
    }, function (err) {
      DURUM.kaydediliyor = false;
      ciz();
      ustBildirimGoster('❌ Güncelleme hatası: ' + (err && err.message ? err.message : err), false);
    });
  }

  function hazirSec(metin) {
    document.getElementById('oyunBaslik').value = metin;
  }

  function mesajGoster(elId, metin, basarili) {
    var el = document.getElementById(elId);
    el.textContent = metin;
    el.className = 'mesaj ' + (basarili ? 'ok' : 'err');
  }

  function oyunKaydet() {
    var baslik = document.getElementById('oyunBaslik').value.trim();
    var tarih = document.getElementById('oyunTarih').value;
    var bas = document.getElementById('oyunBas').value;
    var bit = document.getElementById('oyunBit').value;
    if (!baslik) { mesajGoster('oyunMesaj', 'Lütfen ne yapacağını yaz.', false); return; }

    var btn = document.getElementById('oyunKaydetBtn');
    btn.disabled = true;
    sunucuCagir('oyunEkle', [ANAHTAR, tarih, baslik, bas, bit], function (yeniVeri) {
      btn.disabled = false;
      document.getElementById('oyunBaslik').value = '';
      mesajGoster('oyunMesaj', 'Harika! Programa ve Takvime eklendi 🎉', true);
      if (yeniVeri && yeniVeri.gunler) veriUygula(yeniVeri, tarih);
      else verileriYukle(tarih);
    }, function (err) {
      btn.disabled = false;
      mesajGoster('oyunMesaj', err.message || String(err), false);
    });
  }

  function tatilKaydet() {
    var tarih = document.getElementById('tatilTarih').value;
    var aciklama = document.getElementById('tatilAciklama').value.trim();
    var btn = document.getElementById('tatilKaydetBtn');
    btn.disabled = true;
    sunucuCagir('okulYokEkle', [ANAHTAR, tarih, aciklama], function (yeniVeri) {
      btn.disabled = false;
      document.getElementById('tatilAciklama').value = '';
      mesajGoster('tatilMesaj', 'Tatil günü kaydedildi! Programın 10:00’dan başlayacak 🏖️', true);
      if (yeniVeri && yeniVeri.gunler) veriUygula(yeniVeri, tarih);
      else verileriYukle(tarih);
    }, function (err) {
      btn.disabled = false;
      mesajGoster('tatilMesaj', err.message || String(err), false);
    });
  }

  function verileriYukle(hedefGun) {
    sunucuCagir('haftaGetir', [ANAHTAR, null], function (veri) {
      veriUygula(veri, hedefGun);
    }, function (err) {
      document.getElementById('gorevListesi').innerHTML =
        '<div class="uyari-serit">Bağlantı kurulamadı: ' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
    });
  }

  // Her 25 saniyede bir görev başlangıç saatini kontrol et ve saati gelen görevi sesli anons et!
  setInterval(otomatikSaatAnonsKontrol, 25 * 1000);

  setInterval(function () {
    if (!DURUM.degisiklikVar && !DURUM.kaydediliyor) {
      verileriYukle(DURUM.seciliGun);
    }
  }, 5 * 60 * 1000);

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }
  verileriYukle();
</script>
</body>
</html>
